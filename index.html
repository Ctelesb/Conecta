<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conecta+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F8FD;--surface:#fff;--soft:#E8F0FC;--ink:#14203A;--muted:#46536F;--line:#CBD6EA;--navy:#1F2F55;--accent:#0A7EA8;--on-accent:#fff;--gold:#F2C14E;--ok:#11703F;--err:#B3261E;--warn:#7A4E00;--bw:1px;--fs:100%;--lh:1.55;--ls:0;--r:10px}
[data-theme=dark]{--bg:#0D1526;--surface:#16213A;--soft:#1D2B4A;--ink:#EAF0FB;--muted:#B0BDD6;--line:#34456B;--navy:#EAF0FB;--accent:#6CCBF2;--on-accent:#0D1526;--ok:#6FD39A;--err:#FF9A91;--warn:#F2C14E}
[data-theme=contrast]{--bg:#000;--surface:#000;--soft:#111;--ink:#fff;--muted:#fff;--line:#fff;--navy:#fff;--accent:#FFD400;--on-accent:#000;--ok:#7CFFB0;--err:#FF9A91;--warn:#FFD400;--bw:2px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,sans-serif;line-height:var(--lh);letter-spacing:var(--ls);padding-bottom:5.5rem}
h1,h2,h3{line-height:1.25;margin:0;color:var(--navy)}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:.4rem 0}
a,button,input,select,textarea,summary{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[data-theme=contrast] :focus-visible{outline-color:#fff;box-shadow:0 0 0 5px #000}
.skip{position:absolute;left:-999px;top:.5rem;background:var(--accent);color:var(--on-accent);padding:.6rem 1rem;border-radius:var(--r);z-index:99}.skip:focus{left:.5rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{background:var(--surface);border-bottom:var(--bw) solid var(--line);position:sticky;top:0;z-index:10}
.top-in{max-width:1040px;margin:0 auto;padding:.6rem 1rem;display:flex;align-items:center;gap:.75rem;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.6rem;background:none;border:0;cursor:pointer;font-weight:700;font-size:1.2rem;color:var(--navy);padding:.2rem}
.avatar{width:2.4rem;height:2.4rem;border-radius:50%;object-fit:cover;object-position:50% 25%;background:var(--soft);flex:none}
.avatar.lg{width:3.2rem;height:3.2rem}
nav.main{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:var(--bw) solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom,0)}
nav.main button{flex:1;background:none;border:0;padding:.85rem .2rem;cursor:pointer;font-size:.9rem;color:var(--muted);border-top:4px solid transparent}
nav.main button[aria-current=page]{color:var(--navy);font-weight:700;border-top-color:var(--accent)}
main{max-width:1040px;margin:0 auto;padding:1.25rem 1rem}
main:focus{outline:none}
.narrow{max-width:640px;margin:0 auto}
.stack>*+*{margin-top:1rem}
.sec{margin-top:1.75rem}
section>header,.sec>header{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.6rem}
.muted{color:var(--muted)}.small{font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.75rem;padding:.55rem 1.1rem;border-radius:var(--r);border:var(--bw) solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
[data-theme=contrast] .btn.alt{border-color:#fff}
.btn.link{border:0;background:none;color:var(--accent);padding:.3rem .2rem;min-height:0;text-decoration:underline}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.full{width:100%}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:1rem}
.list{list-style:none;margin:0;padding:0}
.list>li+li{margin-top:.7rem}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:.9rem 1rem;cursor:pointer}
.item:hover{border-color:var(--accent)}
.item .t{font-weight:700;color:var(--navy);display:block}
.tag{display:inline-block;font-size:.85rem;padding:.1rem .55rem;border-radius:6px;background:var(--soft);color:var(--ink);margin-right:.35rem}
.tag.dl{background:var(--gold);color:#14203A;font-weight:700}
.tag.off{background:transparent;border:var(--bw) solid var(--line);color:var(--muted)}
.why{display:block;margin-top:.35rem;font-size:.92rem;color:var(--muted)}
.lumi-box{display:flex;gap:.8rem;align-items:flex-start;background:var(--soft);border-radius:var(--r);padding:1rem}
.lhead{display:flex;gap:.9rem;align-items:center;margin-bottom:.5rem}.lhead .avatar{width:4rem;height:4rem}
.acts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem}.acts .btn{min-height:2.4rem;padding:.3rem .8rem;font-size:.92rem}
.demo{font-size:.9rem;border:var(--bw) dashed var(--muted);padding:.55rem .8rem;border-radius:var(--r)}
label.f,legend.f{display:block;font-weight:700;margin-bottom:.3rem}
.hint{font-weight:400;color:var(--muted);font-size:.9rem}
input[type=text],select,textarea{width:100%;min-height:2.75rem;padding:.55rem .7rem;border-radius:var(--r);border:var(--bw) solid var(--muted);background:var(--surface)}
fieldset{border:0;padding:0;margin:0 0 1.1rem}
.err{color:var(--err);font-weight:700;margin:.3rem 0}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:.5rem .9rem;border:var(--bw) solid var(--muted);border-radius:999px;background:var(--surface)}
.chip input:checked+span{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.opt{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem 1rem;border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;margin-bottom:.5rem}
.opt input{margin-top:.35rem;width:1.1rem;height:1.1rem;accent-color:var(--accent)}
.opt.right{border:3px solid var(--ok)}.opt.wrong{border:3px solid var(--err)}
.bar{height:.6rem;border-radius:99px;background:var(--soft);overflow:hidden;border:var(--bw) solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;gap:1.25rem}
.filters{margin:.8rem 0}
.filters select{margin-bottom:.5rem}
#fChat{position:sticky;bottom:4.6rem;background:var(--bg);padding:.6rem 0;z-index:5}
.chat{display:flex;flex-direction:column;gap:.7rem;margin:1rem 0;min-height:30vh}
.msg{max-width:88%;padding:.7rem .9rem;border-radius:var(--r);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.msg.bot{background:var(--surface);border:var(--bw) solid var(--line)}
.botrow{display:flex;gap:.5rem;align-items:flex-start}
dialog{border:var(--bw) solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:460px;width:calc(100% - 2rem);padding:1.2rem}
dialog::backdrop{background:rgba(0,0,0,.55)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.5rem;background:var(--navy);color:var(--bg);padding:.7rem 1.1rem;border-radius:var(--r);z-index:30;max-width:92%}
[data-theme=dark] .toast{color:#0D1526}[data-theme=contrast] .toast{background:#FFD400;color:#000;border:2px solid #fff}
.hero{display:grid;gap:1.5rem;align-items:center}
.hero img{width:100%;height:auto;border-radius:16px;display:block}
.calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.calm .tag.dl{background:var(--soft);border:var(--bw) solid var(--ink);color:var(--ink)}
.read{--lh:1.9;--ls:.03em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Layout de celular ---- */
:root{--hero:#1F2F55;--r:16px;--shadow:0 1px 2px rgba(20,32,58,.07),0 4px 14px rgba(20,32,58,.05)}
[data-theme=dark]{--hero:#22365F;--shadow:none}
[data-theme=contrast]{--hero:#000;--shadow:none}
body{background:var(--bg);padding-bottom:5.8rem}
.shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
@media(min-width:520px){body{background:#D9E3F4}[data-theme=dark] body{background:#060B15}[data-theme=contrast] body{background:#000}.shell{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(20,32,58,.12)}}
.top-in{max-width:none;padding:.7rem 1rem}
main{max-width:none;padding:1.1rem 1rem 1.5rem}
.narrow{max-width:none}
nav.main{left:50%;right:auto;transform:translateX(-50%);width:100%;max-width:480px;padding:.35rem .25rem calc(.35rem + env(safe-area-inset-bottom,0px));border-top:var(--bw) solid var(--line)}
nav.main button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.2rem 0;border:0;font-size:.78rem;color:var(--muted);flex:1}
nav.main button .ic{display:flex;padding:.25rem 1.05rem;border-radius:99px}
nav.main button svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.main button[aria-current=page]{border:0;color:var(--navy);font-weight:700}
nav.main button[aria-current=page] .ic{background:var(--soft)}
[data-theme=contrast] nav.main button[aria-current=page] .ic{background:#FFD400;color:#000}
.btn{border-radius:14px;min-height:3rem}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#14203A}
.panel,.item{border-radius:var(--r);box-shadow:var(--shadow)}
.item{padding:1rem}
.item .t{font-size:1.05rem;margin:.25rem 0 .1rem}
.tag{border-radius:8px;padding:.15rem .6rem;font-weight:700;font-size:.82rem}
.tag.dl{border-radius:99px}
.bar{height:.7rem}
h1{font-size:1.65rem;letter-spacing:-.01em}
.sec{margin-top:1.6rem}
.hero-card{display:flex;gap:.6rem;background:var(--hero);color:#fff;border-radius:24px;padding:1.2rem 0 1.2rem 1.2rem;overflow:hidden;align-items:stretch}
[data-theme=contrast] .hero-card{border:2px solid #fff}
.hero-card h1{color:#fff;font-size:1.5rem}
.hero-card p{color:#E4ECFB;margin:.5rem 0 .9rem}
.hc-text{flex:1.25;display:flex;flex-direction:column;justify-content:center;min-width:0}
.hero-card img{flex:1;min-width:0;width:40%;object-fit:cover;object-position:52% 28%;border-radius:20px 0 0 20px;margin:-1.2rem 0}
.hero-card .btn{align-self:flex-start;min-height:2.6rem;padding:.4rem 1rem}
.ob{display:flex;flex-direction:column;gap:1rem}
.ob-img{width:100%;height:auto;border-radius:26px;display:block}
.ob h1{font-size:1.9rem;line-height:1.15}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.msg{border-radius:18px}.msg.bot{border-top-left-radius:6px;box-shadow:var(--shadow)}.msg.me{border-bottom-right-radius:6px}
.lhead{background:var(--surface);border-radius:var(--r);padding:.8rem;box-shadow:var(--shadow)}
.lumi-box{border-radius:var(--r)}
dialog{margin:auto auto 0;max-width:480px;width:100%;border-radius:24px 24px 0 0;padding:1.3rem 1.2rem 1.5rem}
.toast{max-width:440px;bottom:6rem}
.chip span{padding:.55rem 1rem}
.sugg{flex-wrap:nowrap;overflow-x:auto;margin:0 -1rem .4rem;padding:.2rem 1rem;scrollbar-width:none}.sugg .btn{flex:none;white-space:nowrap;min-height:2.5rem}

.dt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:3.5rem;padding:.45rem .5rem;border-radius:14px;background:var(--hero);color:#fff;line-height:1.05;flex:none}
.dt b{font-size:1.55rem;color:#fff}.dt small{text-transform:uppercase;font-size:.72rem;letter-spacing:.06em}
[data-theme=contrast] .dt{border:2px solid #fff}
.item.ev{display:flex;gap:.85rem;align-items:flex-start}
.evc{display:flex;flex-direction:column;gap:.35rem;text-align:left;background:var(--surface);border:var(--bw) solid var(--line);border-radius:20px;padding:1rem;cursor:pointer;box-shadow:var(--shadow)}
.evc .t{font-weight:700;color:var(--navy);font-size:1.12rem;margin-top:.3rem}
.evc.big{width:100%;border-width:2px;border-color:var(--accent)}
.car{display:flex;gap:.8rem;overflow-x:auto;scroll-snap-type:x mandatory;margin:.6rem -1rem 0;padding:.3rem 1rem .8rem}
.car>*{flex:0 0 82%;scroll-snap-align:start}
.srow{display:flex;gap:.6rem;align-items:stretch;margin-top:.8rem}
.sinput{flex:1;min-width:0}
.fbtn{position:relative;flex:none;width:3.2rem;border-radius:14px;border:var(--bw) solid var(--muted);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fbtn svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.badge{position:absolute;top:-.4rem;right:-.4rem;min-width:1.35rem;height:1.35rem;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.tabs{display:flex;gap:.4rem;overflow-x:auto;border-bottom:var(--bw) solid var(--line);scrollbar-width:none}
.tabs button{flex:none;background:none;border:0;border-bottom:4px solid transparent;padding:.7rem .8rem;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected=true]{color:var(--navy);font-weight:700;border-bottom-color:var(--accent)}
.mm{margin-top:.6rem}
.mm-c{background:var(--hero);color:#fff;border-radius:99px;padding:.7rem 1.1rem;font-weight:700;text-align:center;display:block}
[data-theme=contrast] .mm-c{border:2px solid #fff}
.mm-b{position:relative;margin:0 0 0 1.2rem;padding:.9rem 0 .2rem 1.2rem;border-left:3px solid var(--line)}
.mm-b::before{content:"";position:absolute;left:0;top:1.9rem;width:1rem;border-top:3px solid var(--line)}
.mm-n{display:block;width:100%;text-align:left;background:var(--surface);border:var(--bw) solid var(--accent);border-radius:14px;padding:.7rem .9rem;cursor:pointer}
.mm-n .t{display:block;font-weight:700;color:var(--navy)}
.mm-k{list-style:none;margin:.5rem 0 0 .8rem;padding:0 0 0 .8rem;border-left:2px dotted var(--line)}
.mm-k li{font-size:.92rem;background:var(--soft);border-radius:10px;padding:.4rem .6rem;margin-bottom:.4rem}
.fcard{background:var(--surface);border:2px solid var(--accent);border-radius:22px;padding:1.4rem 1.2rem;min-height:14rem;margin:.8rem 0 1rem;box-shadow:var(--shadow)}
.fcard:focus{outline:3px solid var(--accent)}
.fl{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}.ft{font-size:1.2rem;margin:.3rem 0 .8rem}
.fcard hr{border:0;border-top:var(--bw) dashed var(--muted);margin:1rem 0}
.sbar{display:flex;height:.8rem;border-radius:99px;overflow:hidden;border:var(--bw) solid var(--line)}
.sbar .g{background:repeating-linear-gradient(45deg,var(--ok),var(--ok) 4px,transparent 4px,transparent 7px);background-color:var(--soft)}.sbar .r{background:var(--err)}
.spot{margin-bottom:.4rem}
details summary{cursor:pointer;color:var(--accent);font-weight:700;padding:.3rem 0}
.toast{width:max-content;max-width:min(92%,440px);text-align:center}
</style>
</head>

<div class="shell">
<a class="skip" href="#app">Ir para o conteúdo</a>
<header class="top"><div class="top-in">
  <button class="brand" data-go="home" aria-label="Conecta+, ir para o início"><img class="avatar" data-lumi alt=""><span>Conecta+</span></button>
  <nav class="main" id="nav" aria-label="Principal" hidden>
    <button data-go="home"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Início</button><button data-go="ops"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Eventos</button><button data-go="trilhas"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h12"/></svg></span>Trilhas</button><button data-go="lumi"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></span>Lumi</button><button data-go="perfil"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Perfil</button>
  </nav>
  <button class="btn alt" id="a11yBtn" aria-haspopup="dialog">Acessibilidade</button>
</div></header>
<main id="app" tabindex="-1"></main>
</div>

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3800);say(m)}
function applyA11y(){const a=S.a11y,h=document.documentElement;h.dataset.theme=a.theme;h.style.setProperty("--fs",a.size+"%");document.body.classList.toggle("calm",a.calm);document.body.classList.toggle("read",a.read)}
const dlText=n=>n<0?"Inscrições encerradas":n===0?"Última chance: hoje":n===1?"Encerra amanhã":`Encerra em ${n} dias`;

/* ---------- Trilhas, foco e recomendações ---------- */
const topicState=id=>S.topics[id]?.last==="err"?"revisar":S.done.includes(id)?"feito":"pendente";
function trackInfo(t){const n=t.ls.length,d=t.ls.filter(l=>S.done.includes(l.id)).length,rev=t.ls.filter(l=>topicState(l.id)==="revisar");return{n,d,pct:Math.round(d/n*100),rev,next:rev[0]||t.ls.find(l=>!S.done.includes(l.id))}}
function trackRank(){const u=S.user||{},ints=u.interests||[],gs=u.goals||[];return TRACKS.map(t=>{const mi=t.tags.filter(x=>ints.includes(x)),mg=t.goals.filter(x=>gs.includes(x)),why=[];if(mi.length)why.push("você se interessa por "+mi.join(" e ").toLowerCase());if(mg.length)why.push("seu objetivo inclui "+GOALS[mg[0]].replace(/^Me /,"").toLowerCase());return{t,sc:mi.length*2+mg.length*2,why}}).sort((a,b)=>b.sc-a.sc)}
function nextStep(){const r=trackRank();const rv=r.find(x=>trackInfo(x.t).rev.length);if(rv)return{t:rv.t,l:trackInfo(rv.t).rev[0],review:true};const a=r.find(x=>x.sc>0&&trackInfo(x.t).next)||r.find(x=>trackInfo(x.t).next);return a?{t:a.t,l:trackInfo(a.t).next,review:false}:null}
const focusText=()=>{const u=S.user||{},g=(u.goals||[]).map(k=>GOALS[k].replace(/^Me /,"").toLowerCase()),i=(u.interests||[]).map(x=>x.toLowerCase());return g.length||i.length?[g.length?"objetivo: "+g.join(", "):"",i.length?"interesse: "+i.join(", "):""].filter(Boolean).join(" · "):""};
function recs(){const u=S.user||{},gs=u.goals||[];return EVENTS.filter(open_).map(e=>{let sc=0,why=[];if((u.interests||[]).includes(e.c)){sc+=3;why.push(`você marcou interesse em ${e.c.toLowerCase()}`)}
if(e.lv.includes(u.level)){sc+=2;why.push("é para a sua etapa de ensino")}
if(gs.includes("oport")&&["Bolsas","Olimpíadas"].includes(e.c)){sc+=1;why.push("você quer encontrar bolsas e olimpíadas")}
if(gs.includes("provas")&&e.c==="Vestibulares e provas"){sc+=1;why.push("você quer se preparar para provas")}
if(e.dl<=7){sc+=1;why.push(`a inscrição termina logo (${dlText(e.dl).toLowerCase()})`)}
if(e.free)sc+=.5;return{e,sc,why}}).sort((a,b)=>b.sc-a.sc||a.e.dl-b.e.dl)}
const whyText=r=>r.why.length?"Aparece aqui porque "+r.why.join(" e ")+".":"Está com inscrições abertas.";

/* ---------- Podcast (voz sintetizada pelo aparelho) ---------- */
const podText=l=>`Olá${S.user?", "+first():""}! Neste episódio vamos falar de ${l.t}. ${l.r} Um exemplo do dia a dia: ${l.x} Cuidado com este erro comum: ${l.e} Para fixar, o passo a passo é este: ${steps(l.p).join(". ")}. Até a próxima!`;
const podMin=l=>Math.max(1,Math.round(podText(l).split(/\s+/).length/150));
const hasTTS=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
function podPlay(id){if(!hasTTS()){toast("Este navegador não tem voz sintetizada. Leia a transcrição.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(podText(TOPICS[id]));u.lang="pt-BR";u.rate=S.podRate||1;u.onend=u.onerror=()=>{if(pod&&pod.u===u){pod=null;podUI()}};pod={id,u,paused:false};speechSynthesis.speak(u);podUI();say("O episódio começou.")}
function podToggle(){if(!pod)return;if(pod.paused){speechSynthesis.resume();pod.paused=false}else{speechSynthesis.pause();pod.paused=true}podUI()}
function podStop(){if(hasTTS())speechSynthesis.cancel();pod=null;podUI()}
function podUI(){document.querySelectorAll("[data-pod]").forEach(b=>{const on=pod&&pod.id===b.dataset.pod;b.textContent=on?(pod.paused?"Continuar":"Pausar"):"Ouvir episódio";b.dataset.act=on?"podtoggle":"podplay"});document.querySelectorAll("[data-podstop]").forEach(b=>b.hidden=!(pod&&pod.id===b.dataset.podstop))}
const podBox=l=>`<div class="panel"><h3>Podcast: ${esc(l.t)}</h3><p class="small muted">Cerca de ${podMin(l)} min. A voz é gerada pelo seu aparelho (síntese de voz), não é uma gravação.</p><div class="row"><button class="btn" data-pod="${l.id}" data-act="podplay" data-id="${l.id}">Ouvir episódio</button><button class="btn alt" data-podstop="${l.id}" data-act="podstop" hidden>Parar</button></div><details style="margin-top:.6rem"><summary>Ler a transcrição</summary><p>${esc(podText(l))}</p></details></div>`;

/* ---------- Telas ---------- */
const V={};
V.onboarding=()=>`<div class="ob"><img class="ob-img" data-lumi alt="Lumi, robô branco e azul com capelo de formatura, segurando livros e acenando"><h1>Eventos, oportunidades e estudo, num lugar só.</h1>
<p>Encontre olimpíadas, provas, concursos e bolsas, guarde os prazos que importam e estude com a ajuda da Lumi.</p>
<p class="muted">A Lumi conhece seu perfil e suas preferências de acessibilidade. Ela orienta, mas a escolha é sempre sua.</p>
<button class="btn full" data-go="cadastro">Criar meu perfil</button><p class="small muted" style="text-align:center">Leva cerca de 1 minuto. Seus dados ficam só neste navegador.</p></div>`;
function a11yControls(){const a=S.a11y;const th=[["light","Claro"],["dark","Escuro"],["contrast","Alto contraste"]],sz=[[100,"Normal"],[120,"Grande"],[140,"Muito grande"]];
return `<fieldset><legend class="f">Tema</legend><div class="chips">${th.map(([v,l])=>`<label class="chip"><input type="radio" name="theme" value="${v}" ${a.theme===v?"checked":""}><span>${l}</span></label>`).join("")}</div></fieldset>
<fieldset><legend class="f">Tamanho do texto</legend><div class="chips">${sz.map(([v,l])=>`<label class="chip"><input type="radio" name="size" value="${v}" ${a.size===v?"checked":""}><span>${l}</span></label>`).join("")}</div></fieldset>
<label class="opt"><input type="checkbox" name="read" ${a.read?"checked":""}><span><b>Espaçamento para leitura</b><br><span class="small muted">Mais espaço entre letras e linhas.</span></span></label>
<label class="opt"><input type="checkbox" name="calm" ${a.calm?"checked":""}><span><b>Menos movimento e destaque</b><br><span class="small muted">Desliga animações e deixa os avisos mais discretos.</span></span></label>`}
V.acess=()=>`<h1>Deixe o Conecta+ do seu jeito</h1><p class="muted">As mudanças valem na hora e ficam salvas. Você também pode mudar pelo botão “Acessibilidade”, no topo de qualquer tela.</p><div id="a11yForm" style="margin:1rem 0">${a11yControls()}</div><button class="btn full" data-go="${S.user?"perfil":"home"}">Pronto</button>`;
V.cadastro=()=>{const u=S.user||{interests:[],goals:[]};return `<h1>${editing?"Editar perfil":"Conte um pouco sobre você"}</h1>
<p class="muted">Usamos isso para sugerir eventos e trilhas de estudo. Nada aqui limita o que você pode ver.</p>
<form id="fCad" novalidate>
<section aria-labelledby="ah" style="margin:1.2rem 0"><h2 id="ah">Precisa de algum ajuste para usar melhor?</h2><p class="small muted">Se sim, escolha agora e veja o resultado na hora. Dá para mudar depois pelo botão “Acessibilidade”.</p><div id="a11yForm" style="margin-top:.8rem">${a11yControls()}</div></section>
<fieldset><label class="f" for="nm">Como podemos te chamar?</label><input id="nm" name="nm" type="text" autocomplete="given-name" value="${esc(u.name||"")}" aria-describedby="e-nm"><div id="e-nm" class="err" hidden>Escreva seu nome ou apelido.</div></fieldset>
<fieldset><label class="f" for="lv">Em que etapa você está?</label><select id="lv" name="lv" aria-describedby="e-lv"><option value="">Escolha uma opção</option>${Object.entries(LEVELS).map(([k,v])=>`<option value="${k}" ${u.level===k?"selected":""}>${v}</option>`).join("")}</select><div id="e-lv" class="err" hidden>Escolha a sua etapa de ensino.</div></fieldset>
<fieldset><legend class="f">O que você quer fazer agora? <span class="hint">(pode marcar mais de uma)</span></legend>${Object.entries(GOALS).map(([k,v])=>`<label class="opt"><input type="checkbox" name="goal" value="${k}" ${(u.goals||[]).includes(k)?"checked":""}><span>${v}</span></label>`).join("")}</fieldset>
<fieldset><legend class="f">Que tipos de evento te interessam? <span class="hint">(opcional)</span></legend><div class="chips">${CATS.map(c=>`<label class="chip"><input type="checkbox" name="int" value="${c}" ${(u.interests||[]).includes(c)?"checked":""}><span>${c}</span></label>`).join("")}</div></fieldset>
<fieldset><label class="f" for="dif">Algo que dificulta seus estudos? <span class="hint">(opcional)</span></label><input id="dif" name="dif" type="text" value="${esc(u.diff||"")}" placeholder="Ex.: me distraio fácil, leio devagar"><p class="small muted">A Lumi usa isso só para adaptar as dicas de estudo. Não muda o que você vê.</p></fieldset>
<div class="row"><button class="btn" type="submit">${editing?"Salvar alterações":"Entrar no Conecta+"}</button>${editing?'<button class="btn alt" type="button" data-go="perfil">Cancelar</button>':""}</div></form>`};
const greet=()=>{const h=new Date().getHours();return h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"};
function lumiSuggest(){const n=nextStep(),near=EVENTS.filter(e=>open_(e)&&e.dl<=3&&S.saved.includes(e.id))[0];
if(near)return{m:`Você guardou “${near.t}” e a inscrição ${dlText(near.dl).toLowerCase()}. Quer ver os detalhes?`,b:"Ver evento",go:"op",id:near.id};
if(n&&n.review)return{m:`No último simulado você errou questões sobre “${n.l.t}”. Quer revisar comigo?`,b:"Revisar com a Lumi",ask:`Explique ${n.l.t}`};
return{m:"Vamos organizar seus estudos? Monto um plano curto com base no seu foco e nos seus prazos.",b:"Montar plano",ask:"Monte um plano para hoje"}}
V.home=()=>{const n=nextStep(),sg=lumiSuggest(),sv=EVENTS.filter(e=>S.saved.includes(e.id)&&open_(e)).sort((a,b)=>a.dl-b.dl),rc=recs().slice(0,4);
return `<section class="hero-card" aria-label="Sugestão da Lumi"><div class="hc-text"><h1>${greet()}, ${esc(first())}.</h1><p>${esc(sg.m)}</p><button class="btn gold" ${sg.ask?`data-ask="${esc(sg.ask)}"`:`data-go="${sg.go}" data-id="${sg.id}"`}>${sg.b}</button></div><img data-lumi alt="Lumi, a assistente do Conecta+"></section>
<section class="sec" aria-labelledby="h-o"><header><h2 id="h-o">Eventos em destaque</h2><button class="btn link" data-go="ops">Ver todos</button></header><div class="car" tabindex="0" role="region" aria-label="Eventos em destaque, role para o lado">${rc.map(evCard).join("")}</div><p class="small muted">Dados de demonstração. Confirme no site oficial antes de se inscrever.</p></section>
<section class="sec" aria-labelledby="h-p"><h2 id="h-p">Seus prazos</h2>${sv.length?`<ul class="list" style="margin-top:.6rem">${sv.map(evItem).join("")}</ul>`:`<p class="muted">Você ainda não guardou nenhum prazo. Abra um evento e escolha “Guardar prazo”.</p>`}</section>
<section class="sec" aria-labelledby="h-c"><h2 id="h-c">Continue de onde parou</h2>${n?`<button class="item" data-go="aula" data-id="${n.l.id}" style="margin-top:.6rem"><span class="tag">${n.review?"Vale revisar":"Próxima aula"}</span><span class="t">${esc(n.l.t)}</span><span class="muted small">${esc(n.t.t)}</span></button>`:`<p>Você estudou todas as aulas. Faça um simulado para manter o ritmo.</p>`}</section>`};

/* Eventos */
function filtered(){const q=F.q.trim().toLowerCase();return EVENTS.filter(e=>(!q||(e.t+" "+e.s+" "+e.c).toLowerCase().includes(q))&&(!F.c||e.c===F.c)&&(!F.lv||e.lv.includes(F.lv))&&(!F.st||(F.st==="aberta"?open_(e):!open_(e)))&&(!F.loc||e.loc===F.loc)&&(!F.cost||(F.cost==="free")===e.free)).sort((a,b)=>(open_(b)-open_(a))||a.dl-b.dl)}
const nFilters=()=>[F.c,F.lv,F.st,F.loc,F.cost].filter(Boolean).length;
function opsList(){const l=filtered();if(!l.length)return `<div class="lumi-box">${lumiImg()}<div><b>Nada com esses filtros.</b><p>Tente tirar algum filtro ou buscar por outra palavra.</p><button class="btn alt" data-act="clear">Limpar tudo</button></div></div>`;
const top=!F.q&&!nFilters()?recs()[0]:null;return (top?`<div class="spot"><p class="small" style="margin:0 0 .4rem"><b>Em destaque para você</b></p><button class="evc big" data-go="op" data-id="${top.e.id}"><span class="row" style="justify-content:space-between;flex-wrap:nowrap">${dateBlock(top.e.d)}<span class="tag dl">${dlText(top.e.dl)}</span></span><span class="t">${esc(top.e.t)}</span><span class="muted">${esc(top.e.s)}</span><span class="why">${esc(whyText(top))}</span></button></div><h2 style="margin:1.2rem 0 .6rem">Todos os eventos</h2>`:"")+`<ul class="list">${l.map(evItem).join("")}</ul>`}
function updateOps(){const l=$("#opsList");if(l){l.innerHTML=opsList();setLumi()}const c=$("#cnt");if(c)c.textContent=filtered().length+" resultado(s)";const fb=$("#fb"),n=nFilters();if(fb){fb.hidden=!n;fb.textContent=n;$("#fBtn").setAttribute("aria-label",n?`Filtros, ${n} ativo(s)`:"Filtros")}const x=$("#fcnt");if(x)x.textContent=filtered().length}
V.ops=()=>`<h1>Eventos e oportunidades</h1><p class="muted">Olimpíadas, provas, concursos e bolsas, com os prazos à vista.</p>
<div class="srow"><div class="sinput"><label class="sr" for="f-q">Buscar eventos</label><input id="f-q" type="text" data-f="q" value="${esc(F.q)}" placeholder="Buscar: matemática, bolsa, redação"></div><button class="fbtn" id="fBtn" data-act="filter" aria-haspopup="dialog" aria-label="${nFilters()?`Filtros, ${nFilters()} ativo(s)`:"Filtros"}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span class="badge" id="fb" ${nFilters()?"":"hidden"}>${nFilters()}</span></button></div>
<p id="cnt" class="small muted" aria-live="polite" style="margin:.6rem 0">${filtered().length} resultado(s)</p><div id="opsList">${opsList()}</div><p class="small muted">Dados de demonstração. Confirme no site oficial antes de se inscrever.</p>`;
const sel=(id,lab,opts,v)=>`<div style="margin-bottom:.7rem"><label class="f small" for="${id}">${lab}</label><select id="${id}" data-f="${id.slice(2)}">${opts.map(([k,t])=>`<option value="${k}" ${v===k?"selected":""}>${t}</option>`).join("")}</select></div>`;
function openFilters(){const d=$("#dlg");d.innerHTML=`<h2 id="dlgT">Filtrar eventos</h2><div style="margin:1rem 0">${sel("f-c","Categoria",[["","Todas"],...CATS.map(c=>[c,c])],F.c)}${sel("f-lv","Etapa",[["","Todas"],...Object.entries(LEVELS)],F.lv)}${sel("f-st","Inscrições",[["","Todas"],["aberta","Abertas"],["fechada","Encerradas"]],F.st)}${sel("f-loc","Local",[["","Todos"],["Online","Online"],["Presencial","Presencial"]],F.loc)}${sel("f-cost","Custo",[["","Todos"],["free","Gratuito"],["paid","Pago"]],F.cost)}</div><div class="row" style="flex-wrap:nowrap"><button class="btn alt" data-act="clearf">Limpar</button><button class="btn" style="flex:1" id="dlgX">Ver <span id="fcnt">${filtered().length}</span> resultado(s)</button></div>`;d.showModal();$("#dlgX").onclick=()=>d.close()}
V.op=()=>{const e=EVENTS.find(x=>x.id===route.id),sv=S.saved.includes(e.id),rc=recs().find(r=>r.e.id===e.id),tr=trackForEvent(e);
return `<div class="stack"><button class="btn link" data-go="ops">Voltar para eventos</button><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${dateBlock(e.d)}<h1 style="flex:1">${esc(e.t)}</h1></div>
<div><span class="tag ${open_(e)?"dl":"off"}">${dlText(e.dl)}</span><span class="tag">${e.c}</span><span class="tag">${e.free?"Gratuito":"Pago"}</span></div>
<p>${esc(e.s)}</p>${rc&&rc.why.length?`<p class="why">${esc(whyText(rc))}</p>`:""}
<dl class="panel" style="margin:0"><dt><b>Quando</b></dt><dd style="margin:0 0 .6rem">${fmt(e.d)}</dd><dt><b>Onde</b></dt><dd style="margin:0 0 .6rem">${e.loc}</dd><dt><b>Para quem</b></dt><dd style="margin:0 0 .6rem">${e.lv.map(k=>LEVELS[k]).join("; ")}</dd><dt><b>Inscrição</b></dt><dd style="margin:0">${open_(e)?"Aberta até "+fmt(e.dl)+".":"Encerrada."}</dd></dl>
<section><h2>Acessibilidade</h2><p>${esc(e.a)}</p></section>
${tr?`<section class="lumi-box">${lumiImg()}<div><b>Quer se preparar?</b><p>A trilha “${esc(tr.t)}” combina com este evento.</p><button class="btn alt" data-go="trilha" data-id="${tr.id}">Abrir trilha</button></div></section>`:""}
<div class="row"><button class="btn" data-act="save" data-id="${e.id}" aria-pressed="${sv}">${sv?"Prazo guardado (remover)":"Guardar prazo"}</button><button class="btn alt" data-act="ics" data-id="${e.id}">Baixar para o calendário</button><button class="btn alt" data-act="share" data-id="${e.id}">Copiar resumo</button><button class="btn alt" data-ask="Por que ${esc(e.t)} combina comigo?">Perguntar à Lumi</button></div><p class="small muted">Dados de demonstração. Não há inscrição real aqui.</p></div>`};

/* Trilhas */
V.trilhas=()=>{const r=trackRank(),foc=focusText(),rec=r.filter(x=>x.sc>0),oth=r.filter(x=>!x.sc);
const card=x=>{const i=trackInfo(x.t);return `<li><button class="item" data-go="trilha" data-id="${x.t.id}"><span class="t">${x.t.t}</span><span class="small muted">${x.t.sub}</span><span class="small muted" style="display:block;margin-top:.3rem">${i.d} de ${i.n} aulas estudadas${i.rev.length?` · ${i.rev.length} para revisar`:""}</span><div class="bar" role="progressbar" aria-label="Progresso em ${esc(x.t.t)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${i.pct}" style="margin-top:.5rem"><i style="width:${i.pct}%"></i></div>${x.why.length?`<span class="why">Indicada porque ${esc(x.why.join(" e "))}.</span>`:""}</button></li>`};
return `<h1>Trilhas de estudo</h1>
<div class="panel" style="margin:1rem 0">${foc?`<p style="margin:0"><b>Seu foco</b><br><span class="muted">${esc(foc)}</span></p>`:`<p style="margin:0" class="muted">Você ainda não escolheu um foco. Escolha no perfil para ver trilhas indicadas para você.</p>`}<button class="btn link" data-act="edit">${foc?"Mudar foco":"Escolher foco"}</button></div>
${rec.length?`<h2>Indicadas para o seu foco</h2><ul class="list" style="margin:.6rem 0 1.4rem">${rec.map(card).join("")}</ul>`:""}
<h2>${rec.length?"Outras trilhas":"Todas as trilhas"}</h2><ul class="list" style="margin:.6rem 0 1.4rem">${(rec.length?oth:r).map(card).join("")}</ul>
<button class="btn alt full" data-go="desempenho">Ver meu desempenho</button>`};
const TABS=[["aulas","Aulas"],["mapa","Mapa mental"],["cartas","Flashcards"],["videos","Vídeos"],["podcast","Podcast"]];
const cardState=id=>S.fc[id]||"new";
function trackTab(t,tab){const i=trackInfo(t);
if(tab==="mapa")return `<p class="muted small">Veja como as aulas se conectam. Toque numa aula para abrir.</p><div class="mm"><div class="mm-c">${esc(t.t)}</div>${t.ls.map(l=>`<div class="mm-b"><button class="mm-n" data-go="aula" data-id="${l.id}"><span class="t">${l.t}</span> ${statusTag(l.id)}</button><ul class="mm-k"><li><b>Ideia:</b> ${esc(l.r.split(/(?<=[.!?])\s/)[0])}</li><li><b>Exemplo:</b> ${esc(l.x)}</li><li><b>Cuidado:</b> ${esc(l.e)}</li></ul></div>`).join("")}</div>`;
if(tab==="cartas"){const cs=CARDS.filter(c=>c.tr===t.id),rv=cs.filter(c=>cardState(c.id)==="rev").length,ok=cs.filter(c=>cardState(c.id)==="ok").length;return `<p>${cs.length} cartões nesta trilha: ${ok} que você lembrou, ${rv} para rever e ${cs.length-ok-rv} que ainda não viu.</p><div class="stack"><button class="btn full" data-act="flash" data-id="tr:${t.id}">Estudar cartões</button>${rv?`<button class="btn alt full" data-act="flash" data-id="rev:${t.id}">Só os ${rv} para rever</button>`:""}</div><p class="small muted">Você vê a pergunta, tenta lembrar e depois confere a resposta. Os cartões que você marca para rever voltam primeiro.</p>`}
if(tab==="videos")return `<div class="stack">${t.ls.map(l=>vidBox(TOPICS[l.id])).join("")}</div>`;
if(tab==="podcast")return `<div class="stack">${t.ls.map(podBox).join("")}</div>`;
return `<button class="btn full" data-act="quiz" data-id="${t.id}">Fazer simulado desta trilha</button><ul class="list" style="margin-top:1rem">${t.ls.map((l,k)=>`<li><button class="item" data-go="aula" data-id="${l.id}"><span class="small muted">Aula ${k+1}</span> ${statusTag(l.id)}<span class="t">${l.t}</span><span class="small muted">${esc(l.r.split(/(?<=[.!?])\s/)[0])}</span></button></li>`).join("")}</ul>`}
V.trilha=()=>{const t=TRACKS.find(x=>x.id===route.id),i=trackInfo(t),tab=route.tab||"aulas";
return `<div class="stack"><button class="btn link" data-go="trilhas">Voltar para trilhas</button><h1>${t.t}</h1><p class="muted" style="margin:0">${t.sub}</p>
<p>${i.d===i.n?"Você estudou todas as aulas.":`Faltam ${i.n-i.d} de ${i.n} aulas.`} ${i.rev.length?"Alguns assuntos precisam de revisão.":""}</p><div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${i.pct}"><i style="width:${i.pct}%"></i></div>
<div class="tabs" role="tablist" aria-label="Conteúdos da trilha">${TABS.map(([k,l])=>`<button role="tab" id="tab-${k}" aria-selected="${tab===k}" aria-controls="tp" data-tab="${k}" data-id="${t.id}">${l}</button>`).join("")}</div>
<div id="tp" role="tabpanel" aria-labelledby="tab-${tab}">${trackTab(t,tab)}</div></div>`};
V.aula=()=>{const l=TOPICS[route.id],t=TRACKS.find(x=>x.id===l.tr),k=t.ls.findIndex(x=>x.id===l.id),nx=t.ls[k+1],ts=S.topics[l.id];
return `<div class="stack"><button class="btn link" data-go="trilha" data-id="${t.id}">Voltar para ${esc(t.t)}</button><p class="muted small" style="margin:0">Aula ${k+1} de ${t.ls.length}</p><h1>${l.t}</h1><div>${statusTag(l.id)}${ts?`<span class="muted small"> Simulados: ${ts.ok} certa(s), ${ts.err} errada(s).</span>`:""}</div>
<section class="panel"><h2>Entenda</h2><p>${esc(l.r)}</p></section>
<section class="panel"><h2>Exemplo do dia a dia</h2><p>${esc(l.x)}</p></section>
<section class="panel"><h2>Passo a passo</h2><ol style="padding-left:1.2rem;margin:.4rem 0">${steps(l.p).map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>
<section class="panel"><h2>Erro comum</h2><p>${esc(l.e)}</p></section>
${podBox(l)}
${vidBox(l)}
<label class="opt"><input type="checkbox" data-done="${l.id}" ${S.done.includes(l.id)?"checked":""}><span>Já estudei esta aula</span></label>
<div class="row"><button class="btn" data-act="quiz" data-id="${t.id}" data-tp="${l.id}">Testar este assunto</button><button class="btn alt" data-act="flash" data-id="ls:${l.id}">Flashcards da aula</button><button class="btn alt" data-ask="Explique ${esc(l.t)} de um jeito mais simples">Explicar com a Lumi</button></div>
${nx?`<button class="item" data-go="aula" data-id="${nx.id}"><span class="small muted">Próxima aula</span><span class="t">${nx.t}</span></button>`:""}</div>`};

/* Flashcards */
function startFlash(spec){const [k,id]=spec.split(":");let cs=k==="ls"?CARDS.filter(c=>c.tp===id):k==="rev"?CARDS.filter(c=>c.tr===id&&cardState(c.id)==="rev"):CARDS.filter(c=>c.tr===id);const w=c=>({rev:0,new:1,ok:2})[cardState(c.id)];cs=cs.sort((a,b)=>w(a)-w(b));fc={ids:cs.map(c=>c.id),i:0,shown:false,res:{},back:k==="ls"?{go:"aula",id}:{go:"trilha",id,tab:"cartas"},spec};go("flash")}
V.flash=()=>{if(!fc||!fc.ids.length)return `<h1>Flashcards</h1><div class="lumi-box">${lumiImg()}<div><p>Não há cartões para estudar agora.</p><button class="btn alt" data-go="trilhas">Voltar às trilhas</button></div></div>`;
const n=fc.ids.length;if(fc.i>=n){const r=Object.values(fc.res),ok=r.filter(x=>x==="ok").length,rv=n-ok;return `<h1>Você viu ${n} cartões</h1><p>${ok} que você lembrou e ${rv} para rever.</p><div class="stack">${rv?`<button class="btn full" data-act="flashrev">Treinar os ${rv} para rever</button>`:`<p>Nenhum cartão para rever. Bom trabalho!</p>`}<button class="btn alt full" data-go="${fc.back.go}" data-id="${fc.back.id}" ${fc.back.tab?`data-tab-go="${fc.back.tab}"`:""}>Voltar</button></div>`}
const c=CARDS.find(x=>x.id===fc.ids[fc.i]);
return `<button class="btn link" data-go="${fc.back.go}" data-id="${fc.back.id}">Sair dos flashcards</button><p class="small muted">Cartão ${fc.i+1} de ${n} · ${esc(TOPICS[c.tp].t)}</p>
<div class="fcard" id="fcard" tabindex="-1"><p class="fl">Pergunta</p><p class="ft">${esc(c.f)}</p>${fc.shown?`<hr><p class="fl">Resposta</p><p class="ft">${esc(c.b)}</p>`:""}</div>
${fc.shown?`<p class="small muted" style="text-align:center">Você lembrou?</p><div class="row" style="flex-wrap:nowrap"><button class="btn alt" style="flex:1" data-act="fmark" data-id="rev">Preciso rever</button><button class="btn" style="flex:1" data-act="fmark" data-id="ok">Lembrei</button></div>`:`<button class="btn full" data-act="fshow" aria-expanded="false">Mostrar resposta</button>`}`};

/* Simulado */
function startQuiz(trId,tp){let qs=QS.filter(q=>q.tr===trId&&(!tp||q.tp===tp));const w=q=>S.topics[q.tp]?.last==="err"?0:S.topics[q.tp]?1:2;qs=qs.sort((a,b)=>w(a)-w(b)||a.id-b.id);quiz={tr:trId,tp,qs,i:0,ans:false,sel:null,res:[]};go("simulado")}
V.simulado=()=>{if(!quiz)return V.trilhas();const t=TRACKS.find(x=>x.id===quiz.tr);
if(quiz.i>=quiz.qs.length){const ok=quiz.res.filter(r=>r.ok).length,wrong=[...new Set(quiz.res.filter(r=>!r.ok).map(r=>r.tp))];
return `<div class="stack"><h1>Você acertou ${ok} de ${quiz.res.length}</h1>${wrong.length?`<div class="panel"><h2>Vale revisar</h2><ul class="list" style="margin-top:.6rem">${wrong.map(w=>`<li><button class="item" data-go="aula" data-id="${w}"><span class="t">${esc(TOPICS[w].t)}</span><span class="small muted">Abrir a aula</span></button></li>`).join("")}</ul></div><button class="btn" data-ask="Explique ${esc(TOPICS[wrong[0]].t)} de um jeito mais simples">Revisar “${esc(TOPICS[wrong[0]].t)}” com a Lumi</button>`:`<p>Nenhum assunto para revisar desta vez. Quando quiser, marque as aulas que já estudou.</p>`}<div class="row"><button class="btn alt" data-act="quiz" data-id="${t.id}" ${quiz.tp?`data-tp="${quiz.tp}"`:""}>Refazer</button><button class="btn alt" data-go="desempenho">Ver desempenho</button><button class="btn alt" data-go="trilha" data-id="${t.id}">Voltar à trilha</button></div></div>`}
const q=quiz.qs[quiz.i];
return `<div class="stack"><button class="btn link" data-go="trilha" data-id="${t.id}">Sair do simulado</button><p class="muted small">Questão ${quiz.i+1} de ${quiz.qs.length} · ${esc(TOPICS[q.tp].t)}</p>
<form id="fQ" novalidate><fieldset ${quiz.ans?"disabled":""}><legend class="f">${esc(q.q)}</legend>${q.o.map((o,k)=>`<label class="opt ${quiz.ans?(k===q.ok?"right":k===quiz.sel?"wrong":""):""}"><input type="radio" name="q" value="${k}" ${quiz.sel===k?"checked":""}><span>${"ABC"[k]}) ${esc(o)}${quiz.ans&&k===q.ok?" (resposta certa)":""}${quiz.ans&&k===quiz.sel&&k!==q.ok?" (sua resposta)":""}</span></label>`).join("")}</fieldset>
<div id="qerr" class="err" hidden>Escolha uma alternativa antes de verificar.</div>
${quiz.ans?`<div id="fb" tabindex="-1" class="lumi-box">${lumiImg()}<div><b>${quiz.sel===q.ok?"Resposta correta.":"Não foi dessa vez. A resposta certa é a "+"ABC"[q.ok]+"."}</b><p>${esc(q.e)}</p><p><b>Jeito mais simples:</b> ${esc(TOPICS[q.tp].r)}</p></div></div><p><button class="btn" type="button" data-act="nextq">${quiz.i+1<quiz.qs.length?"Próxima questão":"Ver resultado"}</button></p>`:`<button class="btn" type="submit">Verificar resposta</button>`}</form></div>`};

/* Desempenho (gráficos com seus dados reais) */
V.desempenho=()=>{const rows=TRACKS.map(t=>({t,i:trackInfo(t)})),tps=Object.entries(S.topics),h=S.hist.slice(-8);
const prog=rows.map(r=>`<li style="margin-bottom:.8rem"><div class="row" style="justify-content:space-between"><b>${esc(r.t.t)}</b><span class="small muted">${r.i.d} de ${r.i.n} aulas</span></div><div class="bar" role="progressbar" aria-label="Progresso em ${esc(r.t.t)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r.i.pct}"><i style="width:${r.i.pct}%"></i></div></li>`).join("");
const emp=`<div class="lumi-box">${lumiImg()}<div><p>Ainda não há simulados. Quando você fizer um, os gráficos aparecem aqui.</p><button class="btn alt" data-go="trilhas">Escolher uma trilha</button></div></div>`;
const byTopic=tps.length?`<ul class="list">${tps.map(([id,v])=>{const tot=v.ok+v.err,po=Math.round(v.ok/tot*100);return `<li style="margin-bottom:.8rem"><div class="row" style="justify-content:space-between"><b>${esc(TOPICS[id].t)}</b><span class="small muted">${v.ok} certa(s) · ${v.err} errada(s)</span></div><div class="sbar" role="img" aria-label="${po}% de acertos em ${esc(TOPICS[id].t)}"><i class="g" style="width:${po}%"></i><i class="r" style="width:${100-po}%"></i></div></li>`}).join("")}</ul><p class="small muted">Verde com listras: acertos. Vermelho liso: erros.</p>`:emp;
let chart=emp;if(h.length){const W=320,H=150,bw=Math.min(28,Math.floor(W/h.length)-8),gap=(W-bw*h.length)/(h.length+1);const bars=h.map((x,k)=>{const p=Math.round(x.ok/x.n*100),bh=Math.round(p*1.1),bx=Math.round(gap+k*(bw+gap));return `<rect x="${bx}" y="${125-bh}" width="${bw}" height="${bh}" rx="4" fill="var(--accent)"/><text x="${bx+bw/2}" y="${120-bh}" text-anchor="middle" font-size="11" fill="currentColor">${p}%</text><text x="${bx+bw/2}" y="142" text-anchor="middle" font-size="10" fill="currentColor">${k+1}</text>`}).join("");
chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Porcentagem de acertos nos últimos ${h.length} simulados: ${h.map(x=>Math.round(x.ok/x.n*100)+"%").join(", ")}" style="width:100%;color:var(--ink)"><line x1="0" y1="125" x2="${W}" y2="125" stroke="var(--line)" stroke-width="2"/>${bars}</svg><p class="small muted">Do mais antigo (1) ao mais recente (${h.length}).</p><details><summary>Ver em lista</summary><ul>${h.map((x,k)=>`<li>${k+1}. ${x.date}: ${esc(x.tr)}, ${x.ok} de ${x.n} certas</li>`).join("")}</ul></details>`}
return `<div class="stack"><button class="btn link" data-go="trilhas">Voltar para trilhas</button><h1>Meu desempenho</h1><p class="muted">Tudo aqui vem do que você marcou e respondeu.</p>
<section class="panel"><h2>Progresso nas trilhas</h2><ul class="list" style="margin-top:.8rem">${prog}</ul></section>
<section class="panel"><h2>Acertos por assunto</h2><div style="margin-top:.8rem">${byTopic}</div></section>
<section class="panel"><h2>Últimos simulados</h2><div style="margin-top:.8rem">${chart}</div></section></div>`};

/* Lumi */
V.lumi=()=>{const foc=focusText();return `<div><div class="lhead">${lumiImg("avatar")}<div><h1>Lumi</h1><p class="small muted" style="margin:0">${LUMI_ENDPOINT?"Respostas geradas por IA, com base nos seus dados.":"Responde com base nos seus prazos, trilhas e simulados. Neste protótipo usa regras locais, não um modelo de IA."}</p></div></div>
<p class="small muted" style="margin:.6rem 0 0">${foc?"Eu sei do seu perfil: "+esc(foc)+".":"Ainda não sei seu foco. Você pode contar no perfil."}</p>
<div class="chat" id="chat" role="log" aria-label="Conversa com a Lumi">${S.chat.length?S.chat.map(msgHtml).join(""):msgHtml(welcome())}</div>
<div class="chips sugg" aria-label="Sugestões">${chipList().map(q=>`<button class="btn alt" data-ask="${esc(q)}">${esc(q)}</button>`).join("")}</div>
<form id="fChat" class="row" style="flex-wrap:nowrap"><label class="sr" for="ci">Mensagem para a Lumi</label><input id="ci" type="text" autocomplete="off" placeholder="Escreva sua dúvida"><button class="btn" type="submit">Enviar</button></form>
${S.chat.length?'<p><button class="btn link" data-act="clearchat">Limpar conversa</button></p>':""}</div>`};
const actHtml=a=>a.href?`<a class="btn alt" href="${esc(a.href)}" target="_blank" rel="noopener noreferrer">${esc(a.l)} (outra aba)</a>`:a.ask?`<button class="btn alt" data-ask="${esc(a.ask)}">${esc(a.l)}</button>`:a.act?`<button class="btn alt" data-act="${a.act}" data-id="${esc(a.id||"")}" ${a.tp?`data-tp="${a.tp}"`:""}>${esc(a.l)}</button>`:`<button class="btn alt" data-go="${a.go}" ${a.id!==undefined?`data-id="${esc(a.id)}"`:""}>${esc(a.l)}</button>`;
const msgHtml=m=>m.me?`<div class="msg me">${esc(m.t)}</div>`:`<div class="botrow">${lumiImg()}<div style="min-width:0"><div class="msg bot">${esc(m.t)}</div>${m.acts&&m.acts.length?`<div class="acts">${m.acts.map(actHtml).join("")}</div>`:""}</div></div>`;
function welcome(){const n=nextStep(),near=EVENTS.filter(e=>open_(e)&&e.dl<=7&&S.saved.includes(e.id))[0],tr=trackRank()[0];let t=`Oi, ${first()}! Eu sou a Lumi. Posso explicar um assunto, mostrar eventos e prazos, indicar trilhas ou montar um plano de estudo.`;const acts=[];if(near){t+=`\n\nVocê guardou “${near.t}” e a inscrição ${dlText(near.dl).toLowerCase()}.`;acts.push({l:"Ver evento",go:"op",id:near.id})}else if(n&&n.review)t+=`\n\nNo último simulado você errou questões de “${n.l.t}”. Quer revisar?`;else if(tr.sc>0){t+=`\n\nPelo seu foco, a trilha “${tr.t.t}” é um bom começo.`;acts.push({l:"Abrir trilha",go:"trilha",id:tr.t.id})}return{t,acts}}
function chipList(){const n=nextStep(),c=[];if(n)c.push("Explique "+n.l.t);c.push("O que estudar hoje?","Quais prazos estão chegando?","Como estou nos estudos?","Indique eventos para mim");return c.slice(0,5)}
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const KW={porcent:["porcentagem","porcento"],sucess:["sucessiv","desconto","aumento"],regra3:["regra de tres","regra de 3"],juros:["juros"],ideia:["ideia principal"],conect:["conectivo"],infer:["inferenc","inferir"],cadeia:["cadeia alimentar","cadeias"],carbono:["carbono","fotossintese"],relacoes:["relacoes","mutualismo","parasitismo"],edital:["edital"],prazos:["organizar prazos","documentos"],projeto:["projeto"]};
const findTopic=m=>Object.keys(KW).find(k=>KW[k].some(w=>m.includes(w))||m.includes(norm(TOPICS[k].t)));
const evActs=l=>l.map(e=>({l:"Ver: "+e.t,go:"op",id:e.id}));
function localLumi(msg){const m=norm(msg),ctx=S.ctx||{};let tp=findTopic(m);
const again=/outro jeito|exemplo|nao entendi|mais simples|de novo|explica melhor/.test(m);
const wantPod=/podcast|ouvir|audio/.test(m),wantFc=/flashcard|cartao|cartoes|cartas/.test(m),wantMap=/mapa mental|mapa/.test(m);
if(!tp&&(again||wantPod||wantFc||wantMap)&&ctx.topic)tp=ctx.topic;
if(/video|youtube/.test(m)){const lid=tp||ctx.topic||nextStep()?.l.id;if(lid){S.ctx={topic:lid};return{t:`Separei uma busca de videoaulas sobre ${TOPICS[lid].t}. Os vídeos abrem no YouTube, em outra aba.`,acts:[{l:"Buscar no YouTube",href:ytUrl(TOPICS[lid])},{l:"Abrir a aula",go:"aula",id:lid}]}}}
if(tp&&wantPod){const l=TOPICS[tp];S.ctx={topic:tp};return{t:`Tem um episódio de cerca de ${podMin(l)} min sobre ${l.t}. A voz é gerada pelo seu aparelho.`,acts:[{l:"Ouvir episódio",act:"podplay",id:tp},{l:"Abrir a aula",go:"aula",id:tp}]}}
if(tp&&wantFc){S.ctx={topic:tp};return{t:`Montei os cartões de ${TOPICS[tp].t}. Vale tentar lembrar a resposta antes de virar o cartão.`,acts:[{l:"Estudar cartões",act:"flash",id:"ls:"+tp}]}}
if(tp&&wantMap||wantMap){const tr=tp?TOPICS[tp].tr:trackRank()[0].t.id;return{t:"O mapa mental mostra as aulas da trilha e como elas se ligam.",acts:[{l:"Abrir mapa mental",act:"mapa",id:tr}]}}
if(wantPod||wantFc){const n=nextStep();if(n)return{t:`${wantPod?"Para ouvir":"Para os cartões"}, sugiro começar por ${n.l.t}.`,acts:[wantPod?{l:"Ouvir episódio",act:"podplay",id:n.l.id}:{l:"Estudar cartões",act:"flash",id:"ls:"+n.l.id}]}}
if(tp){const l=TOPICS[tp],wantEx=again||/exemplo/.test(m);S.ctx={topic:tp};const err=S.topics[tp]?.last==="err";
return{t:(wantEx?`Um exemplo do dia a dia sobre ${l.t.toLowerCase()}:\n\n${l.x}`:`${l.t}\n\n${l.r}\n\nCuidado: ${l.e}`)+(err?"\n\nVocê errou questões deste assunto no simulado, então vale reforçar.":""),acts:[wantEx?{l:"Explicar de novo",ask:"Explique "+l.t}:{l:"Dar um exemplo",ask:"Dê um exemplo de "+l.t},{l:"Ouvir episódio",act:"podplay",id:tp},{l:"Abrir a aula",go:"aula",id:tp},{l:"Testar este assunto",act:"quiz",id:l.tr,tp}]}}
if(/prazo|inscri|encerr|vence|chegando|urgente/.test(m)){const l=EVENTS.filter(open_).sort((a,b)=>a.dl-b.dl).slice(0,3);return{t:"Estas inscrições terminam primeiro (dados de demonstração):\n"+l.map(e=>`• ${e.t}: ${dlText(e.dl).toLowerCase()}${S.saved.includes(e.id)?" (você guardou)":""}`).join("\n")+"\n\nConfirme as datas no site oficial antes de se inscrever.",acts:evActs(l)}}
if(/combina|por que|porque/.test(m)){const r=recs().find(x=>m.includes(norm(x.e.t).slice(0,18)));if(r)return{t:`${r.e.t}: ${whyText(r)}`,acts:evActs([r.e])}}
if(/trilha|foco|o que estudar|qual estudo/.test(m)){const r=trackRank().slice(0,3);return{t:"Trilhas para você"+(focusText()?` (${focusText()})`:"")+":\n"+r.map((x,k)=>`${k+1}. ${x.t.t}${x.why.length?": indicada porque "+x.why.join(" e "):""}`).join("\n"),acts:r.map(x=>({l:"Abrir: "+x.t.t,go:"trilha",id:x.t.id}))}}
if(/evento|oportunid|indic|recomend|bolsa|olimpiada|concurso|vestibular|sugest/.test(m)){const r=recs().slice(0,3);return{t:"Com base no seu perfil, estes parecem bons (dados de demonstração):\n"+r.map(x=>`• ${x.e.t}. ${whyText(x)}`).join("\n"),acts:[...evActs(r.map(x=>x.e)),{l:"Ver todos os eventos",go:"ops"}]}}
if(/grafico|desempenho|como estou|progresso|onde errei|dificuldade|revisar|errei/.test(m)){const rows=TRACKS.map(t=>({t,i:trackInfo(t)})),rev=rows.flatMap(r=>r.i.rev),last=S.hist[S.hist.length-1];return{t:rows.map(r=>`• ${r.t.t}: ${r.i.d} de ${r.i.n} aulas estudadas`).join("\n")+(last?`\n\nVocê fez ${S.hist.length} simulado(s). O último: ${last.ok} de ${last.n} certas.`:"\n\nVocê ainda não fez simulados, então não tenho notas para comparar.")+(rev.length?"\n\nPara revisar: "+rev.map(l=>l.t).join(", ")+".":""),acts:[{l:"Ver gráficos",go:"desempenho"},...rev.slice(0,2).map(l=>({l:"Revisar "+l.t,ask:"Explique "+l.t}))]}}
if(/organiz|estud|plano|comec|perdid|foco|rotina|hoje/.test(m)){const n=nextStep(),near=EVENTS.filter(e=>open_(e)&&e.dl<=7&&S.saved.includes(e.id))[0],st=[],acts=[];if(n){st.push(`${n.review?"Revisar":"Ler"} a aula “${n.l.t}” (${n.t.t}), cerca de 15 minutos.`,`Ouvir o episódio ou fazer os flashcards dela.`);acts.push({l:"Abrir a aula",go:"aula",id:n.l.id},{l:"Ouvir episódio",act:"podplay",id:n.l.id})}st.push("Fazer um simulado curto para ver como está.");if(n)acts.push({l:"Fazer simulado",act:"quiz",id:n.t.id,tp:n.l.id});if(near){st.push(`Conferir “${near.t}”: a inscrição ${dlText(near.dl).toLowerCase()}.`);acts.push({l:"Ver evento",go:"op",id:near.id})}
const d=S.user?.diff;return{t:"Um plano simples para hoje:\n"+st.map((s,i)=>`${i+1}. ${s}`).join("\n")+(d?`\n\nVocê contou que ${d.toLowerCase()}. Faça uma pausa de 5 minutos entre as etapas.`:""),acts}}
if(/acessib|fonte|letra|contraste|escuro|animac|tamanho/.test(m))return{t:"Dá para mudar o tema, aumentar o texto, aumentar o espaçamento e reduzir movimento. As mudanças valem na hora e ficam salvas.",acts:[{l:"Abrir ajustes",act:"a11y"}]};
if(/quem e voce|o que voce faz|voce e|ia de verdade|inteligencia/.test(m))return{t:"Sou a Lumi, assistente do Conecta+. Neste protótipo eu respondo com regras criadas pela equipe, usando seus prazos, trilhas e simulados. Ainda não sou um modelo de IA conectado a um servidor. Posso explicar assuntos, abrir podcasts, mapas mentais e flashcards, mostrar eventos e sugerir um plano de estudo.",acts:[]};
if(/obrigad|valeu|entendi/.test(m))return{t:"De nada! Se quiser, monto um plano de estudo ou mostro o que vence primeiro.",acts:[{l:"Montar plano",ask:"Monte um plano para hoje"}]};
if(/^(oi|ola|e ai|bom dia|boa tarde|boa noite)/.test(m))return welcome();
return{t:"Não consegui entender bem esse pedido. Eu posso:\n• explicar um assunto (ex.: regra de três, mutualismo)\n• abrir podcast, mapa mental ou flashcards\n• mostrar prazos e indicar eventos\n• dizer como você está nas trilhas\n• montar um plano de estudo",acts:[{l:"Quais prazos?",ask:"Quais prazos estão chegando?"},{l:"Plano para hoje",ask:"Monte um plano para hoje"}]}}
async function askLumi(msg){if(LUMI_ENDPOINT){try{const r=await fetch(LUMI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:msg,history:S.chat.slice(-8),context:{user:S.user,done:S.done,topics:S.topics,saved:S.saved}})});if(!r.ok)throw 0;return{t:(await r.json()).reply,acts:[]}}catch(e){const l=localLumi(msg);l.t+="\n\n(O serviço de IA não respondeu agora. Usei as respostas locais.)";return l}}await new Promise(r=>setTimeout(r,450));return localLumi(msg)}
async function send(text){text=text.trim();if(!text)return;S.chat.push({me:1,t:text});persist();route={n:"lumi"};render(false);$("#chat").insertAdjacentHTML("beforeend",`<div class="botrow" id="typing">${lumiImg()}<div class="msg bot">Lumi está escrevendo…</div></div>`);setLumi();$("#typing").scrollIntoView({block:"nearest"});const r=await askLumi(text);S.chat.push(r);persist();render(false);const ch=$("#chat");if(ch){ch.lastElementChild.scrollIntoView({block:"nearest"});$("#ci").focus({preventScroll:true})}say("Lumi respondeu: "+r.t)}
function openA11y(){const d=$("#dlg");d.innerHTML=`<h2 id="dlgT">Acessibilidade</h2><div style="margin:1rem 0" id="a11yForm">${a11yControls()}</div><button class="btn full" id="dlgX">Fechar</button>`;d.showModal();$("#dlgX").onclick=()=>d.close()}

V.perfil=()=>{const u=S.user,foc=focusText();return `<div class="stack"><h1>${esc(u.name)}</h1><p class="muted">${LEVELS[u.level]}</p>
<div class="row"><button class="btn" data-act="edit">Editar perfil</button><button class="btn alt" data-go="acess">Acessibilidade</button></div>
<section><h2>Seu foco</h2><p>${foc?esc(foc):"Nenhum foco escolhido. Você vê todos os eventos e trilhas."}</p></section>

<section><h2>Últimos simulados</h2>${S.hist.length?`<ul>${S.hist.slice(-5).reverse().map(h=>`<li>${h.date}: ${esc(h.tr)}, ${h.ok} de ${h.n} certas</li>`).join("")}</ul><button class="btn alt" data-go="desempenho">Ver gráficos</button>`:`<div class="lumi-box">${lumiImg()}<div><p>Você ainda não fez nenhum simulado.</p><button class="btn alt" data-go="trilhas">Escolher uma trilha</button></div></div>`}</section>
<section><h2>Seus dados</h2><p class="small muted">Tudo fica salvo só neste navegador. Não há conta nem servidor neste protótipo.</p><button class="btn alt" data-act="wipe">Apagar meus dados</button></section></div>`};

/* ---------- Navegação e eventos ---------- */
const TITLES={onboarding:"Boas-vindas",cadastro:"Seu perfil",acess:"Acessibilidade",home:"Início",ops:"Eventos",op:"Evento",trilhas:"Trilhas",trilha:"Trilha",aula:"Aula",flash:"Flashcards",simulado:"Simulado",desempenho:"Desempenho",lumi:"Lumi",perfil:"Perfil"};
const TAB={home:"home",ops:"ops",op:"ops",trilhas:"trilhas",trilha:"trilhas",aula:"trilhas",flash:"trilhas",simulado:"trilhas",desempenho:"trilhas",lumi:"lumi",perfil:"perfil",acess:"perfil",cadastro:"perfil"};
function setLumi(){document.querySelectorAll("img[data-lumi]").forEach(i=>i.src=LUMI_SRC)}
function render(focus=true){const app=$("#app");if(!S.user&&!["onboarding","cadastro","acess"].includes(route.n))route={n:"onboarding"};app.innerHTML=V[route.n]();const nav=$("#nav");nav.hidden=!S.user||(["onboarding","cadastro"].includes(route.n)&&!editing);
nav.querySelectorAll("button").forEach(b=>b.dataset.go===TAB[route.n]?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
document.title=TITLES[route.n]+" · Conecta+";setLumi();podUI();if(focus){const h=app.querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)}}
function go(n,id,extra){if(n!=="aula"&&n!=="trilha")podStop();route={n,id,...extra};render()}
const idv=r=>/^\d+$/.test(r)?+r:r;
document.addEventListener("click",e=>{const b=e.target.closest("[data-go],[data-act],[data-ask],[data-tab]");if(!b)return;
if(b.dataset.ask){send(b.dataset.ask);return}
if(b.dataset.tab){route={n:"trilha",id:b.dataset.id,tab:b.dataset.tab};render(false);$("#tab-"+b.dataset.tab).focus();return}
if(b.dataset.go&&!b.dataset.act){go(b.dataset.go,b.dataset.id?idv(b.dataset.id):undefined,b.dataset.tabGo?{tab:b.dataset.tabGo}:undefined);return}
const a=b.dataset.act,id=idv(b.dataset.id||"");
if(a==="save"){const i=S.saved.indexOf(id);if(i<0&&!open_(EVENTS.find(x=>x.id===id))){toast("As inscrições deste evento já encerraram, então não há prazo para guardar.");return}if(i>=0)S.saved.splice(i,1);else S.saved.push(id);persist();render(false);$("[data-act=save]").focus();toast(i>=0?"Prazo removido da sua lista.":"Prazo guardado. Ele aparece no seu início. Não enviamos lembretes automáticos.")}
if(a==="ics"){const ev=EVENTS.find(x=>x.id===id),p=n=>addDays(n).toISOString().slice(0,10).replace(/-/g,"");const ics=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Conecta+//PT\r\nBEGIN:VEVENT\r\nUID:${ev.id}@conectamais.demo\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z\r\nDTSTART;VALUE=DATE:${p(ev.d)}\r\nSUMMARY:${ev.t.replace(/[,;]/g," ")}\r\nDESCRIPTION:Dados de demonstração. Confirme no site oficial.\r\nEND:VEVENT\r\nEND:VCALENDAR`;const u=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})),l=document.createElement("a");l.href=u;l.download="evento.ics";l.click();URL.revokeObjectURL(u);toast("Arquivo evento.ics baixado. Abra-o para adicionar ao seu calendário.")}
if(a==="share"){const ev=EVENTS.find(x=>x.id===id),txt=`${ev.t}: inscrições ${dlText(ev.dl).toLowerCase()}. (Conecta+, dados de demonstração)`;(navigator.clipboard?.writeText(txt)||Promise.reject()).then(()=>toast("Resumo copiado."),()=>toast("Não foi possível copiar automaticamente."))}
if(a==="filter")openFilters();
if(a==="clearf"){F={...F,c:"",lv:"",st:"",loc:"",cost:""};document.querySelectorAll("#dlg select").forEach(s=>s.value="");updateOps()}
if(a==="clear"){F={q:"",c:"",lv:"",st:"",loc:"",cost:""};render(false);$("#f-q").focus()}
if(a==="quiz")startQuiz(id,b.dataset.tp);
if(a==="mapa")go("trilha",id,{tab:"mapa"});
if(a==="flash")startFlash(String(id));
if(a==="fshow"){fc.shown=true;render(false);$("#fcard").focus();say("Resposta: "+$("#fcard").innerText)}
if(a==="fmark"){const cid=fc.ids[fc.i];S.fc[cid]=id;fc.res[cid]=id;fc.i++;fc.shown=false;persist();render();}
if(a==="flashrev"){const ids=fc.ids.filter(x=>fc.res[x]==="rev");fc={...fc,ids,i:0,shown:false,res:{}};render()}
if(a==="podplay")podPlay(id);if(a==="podtoggle")podToggle();if(a==="podstop")podStop();
if(a==="nextq"){quiz.i++;quiz.ans=false;quiz.sel=null;if(quiz.i>=quiz.qs.length){const ok=quiz.res.filter(r=>r.ok).length;S.hist.push({date:new Date().toLocaleDateString("pt-BR"),tr:TRACKS.find(t=>t.id===quiz.tr).t,ok,n:quiz.res.length});persist()}render()}
if(a==="edit"){editing=true;go("cadastro")}
if(a==="a11y")openA11y();
if(a==="clearchat"){S.chat=[];persist();render(false)}
if(a==="wipe"&&confirm("Apagar perfil, prazos, progresso e conversa deste navegador? Isso não pode ser desfeito.")){S=blank();persist();applyA11y();editing=false;go("onboarding");toast("Dados apagados.")}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
if(f==="fCad"){const d=new FormData(e.target),nm=(d.get("nm")||"").trim(),lv=d.get("lv");$("#e-nm").hidden=!!nm;$("#e-lv").hidden=!!lv;if(!nm){$("#nm").focus();return}if(!lv){$("#lv").focus();return}
S.user={name:nm,level:lv,goals:d.getAll("goal"),interests:d.getAll("int"),diff:(d.get("dif")||"").trim()};persist();const was=editing;editing=false;go(was?"perfil":"home");toast(was?"Perfil atualizado.":"Perfil criado. Veja os eventos em destaque.")}
if(f==="fQ"){const v=new FormData(e.target).get("q");if(v===null){$("#qerr").hidden=false;e.target.querySelector("input").focus();return}const q=quiz.qs[quiz.i],ok=+v===q.ok;quiz.sel=+v;quiz.ans=true;quiz.res.push({tp:q.tp,ok});const t=S.topics[q.tp]||{ok:0,err:0};ok?t.ok++:t.err++;t.last=ok?"ok":"err";S.topics[q.tp]=t;persist();render(false);$("#fb").focus();say(ok?"Resposta correta.":"Resposta incorreta. A certa é a "+"ABC"[q.ok])}
if(f==="fChat"){const i=$("#ci"),v=i.value;i.value="";send(v)}});
document.addEventListener("input",e=>{const k=e.target.dataset.f;if(k){F[k]=e.target.value;updateOps()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.f){F[t.dataset.f]=t.value;updateOps();return}
if(t.dataset.rate){S.podRate=+t.value;persist();return}
if(t.dataset.done){const i=S.done.indexOf(t.dataset.done);i>=0?S.done.splice(i,1):S.done.push(t.dataset.done);persist();render(false);document.querySelector(`[data-done=${t.dataset.done}]`).focus();toast(i>=0?"Aula desmarcada.":"Aula marcada como estudada.");return}
if(t.closest("#a11yForm")){const a=S.a11y;if(t.name==="theme")a.theme=t.value;if(t.name==="size")a.size=+t.value;if(t.name==="read")a.read=t.checked;if(t.name==="calm")a.calm=t.checked;applyA11y();persist()}});
$("#a11yBtn").addEventListener("click",openA11y);
$("#dlg").addEventListener("close",()=>updateOps());
applyA11y();render(false);

</script>
</body>
</html>
